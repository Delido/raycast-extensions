name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    name: ${{ matrix.extension }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        extension: [amp, bookstack, checkmk, cs2-nades, defender-security, g4f, keep-awake, laps-connect, mtr, onedev, paperless, power-plan, sharepoint, signalrgb, snipeit, ssh, teams, window-drag]
    defaults:
      run:
        working-directory: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.extension }}/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: npm ci
      - name: Build (incl. Go helper)
        run: npm run build
      - name: Typecheck
        shell: bash
        # JavaScript-only extensions (g4f) have no tsconfig.json
        run: if [ -f tsconfig.json ]; then npx tsc --noEmit -p .; else echo "no tsconfig.json, skipped"; fi
      - name: ESLint
        run: npx eslint src
      - name: Prettier
        run: npx prettier --check src

  go:
    name: go vet (${{ matrix.dir }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [mtr/probe, power-plan/helper, signalrgb/helper, window-drag/helper]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache: false
      - run: go vet ./...
        working-directory: ${{ matrix.dir }}
