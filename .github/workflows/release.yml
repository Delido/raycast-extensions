name: Release

# Push a tag like v1.2.0 to publish the prebuilt Windows helpers.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  helpers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Build helpers
        shell: bash
        run: |
          (cd mtr && node ../scripts/build-go-helper.mjs probe assets/mtr-probe.exe)
          (cd power-plan && node ../scripts/build-go-helper.mjs helper assets/power-helper.exe)
          (cd signalrgb && node ../scripts/build-go-helper.mjs helper assets/signal-helper.exe --gui)
          (cd window-drag && node ../scripts/build-go-helper.mjs helper assets/drag-helper.exe --gui)
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            mtr/assets/mtr-probe.exe \
            power-plan/assets/power-helper.exe \
            signalrgb/assets/signal-helper.exe \
            window-drag/assets/drag-helper.exe
