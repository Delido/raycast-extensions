name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    name: ${{ matrix.extension }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        extension: [amp, bookstack, checkmk, mtr, onedev, paperless, power-plan, sharepoint, signalrgb, teams]
    defaults:
      run:
        working-directory: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.extension }}/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - run: npm ci
      - name: Build (incl. Go helper)
        run: npm run build
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: ESLint
        run: npx eslint src
      - name: Prettier
        run: npx prettier --check src

  go:
    name: go vet (${{ matrix.dir }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [mtr/probe, power-plan/helper, signalrgb/helper]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache: false
      - run: go vet ./...
        working-directory: ${{ matrix.dir }}
