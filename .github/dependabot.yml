version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /amp
      - /bookstack
      - /checkmk
      - /mtr
      - /onedev
      - /paperless
      - /power-plan
      - /sharepoint
      - /signalrgb
      - /teams
    schedule:
      interval: monthly
    ignore:
      # Raycast runs extensions on Node 22 with React 19.0, and @raycast/eslint-config
      # supports TypeScript < 6.1. Bigger jumps break the build.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      raycast:
        patterns: ["@raycast/*"]
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directories:
      - /mtr/probe
      - /power-plan/helper
      - /signalrgb/helper
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
