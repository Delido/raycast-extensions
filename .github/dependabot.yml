version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /amp
      - /bookstack
      - /checkmk
      - /cs2-nades
      - /defender-security
      - /keep-awake
      - /laps-connect
      - /mtr
      - /onedev
      - /paperless
      - /power-plan
      - /sharepoint
      - /signalrgb
      - /snipeit
      - /ssh
      - /teams
      - /window-drag
    schedule:
      interval: monthly
    ignore:
      # Raycast runs extensions on Node 22, and @raycast/eslint-config supports
      # TypeScript < 6.1. Bigger jumps break the build.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Must match the exact version pinned by @raycast/api, otherwise two React type copies clash.
      - dependency-name: "@types/react"
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      raycast:
        patterns: ["@raycast/*"]
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directories:
      - /mtr/probe
      - /power-plan/helper
      - /signalrgb/helper
      - /window-drag/helper
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
